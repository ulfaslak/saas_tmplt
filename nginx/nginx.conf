load_module modules/ngx_http_acme_module.so;

# Replace <DOMAIN> with your actual domain (e.g. app.example.com) and <ACME_EMAIL>
# with the address Let's Encrypt should contact about cert issues. Search-and-replace
# both before first deploy.

events {
    worker_connections 1024;
}

http {
    # Docker internal DNS — re-resolves container IPs on every request.
    # This is the key to zero-downtime deploys: when a container is replaced,
    # nginx picks up the new IP automatically without restart or reload.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # ACME needs external DNS for Let's Encrypt
    acme_issuer letsencrypt {
        uri                   https://acme-v02.api.letsencrypt.org/directory;
        contact               <ACME_EMAIL>;
        state_path            /etc/nginx/acme;
        accept_terms_of_service;
    }

    acme_shared_zone zone=ngx_acme_shared:1M;

    # Custom 502 error page shown during deploys
    error_page 502 /502.html;

    # HTTP -> HTTPS redirect (also serves ACME HTTP-01 challenges)
    server {
        listen 80;
        server_name <DOMAIN>;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name <DOMAIN>;

        acme_certificate letsencrypt;
        ssl_certificate       $acme_certificate;
        ssl_certificate_key   $acme_certificate_key;
        ssl_certificate_cache max=2;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        gzip on;
        gzip_types text/plain application/json application/javascript text/css;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Serve custom error page
        location = /502.html {
            root /etc/nginx/html;
            internal;
        }

        location / {
            set $backend http://app:3000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
