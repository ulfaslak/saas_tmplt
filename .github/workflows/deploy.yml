name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'nginx/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check_skip.outputs.should_deploy }}
    steps:
      - name: Check for skip deploy marker
        id: check_skip
        run: |
          COMMIT_MSG=$(cat <<'MSGEOF'
          ${{ github.event.head_commit.message }}
          MSGEOF
          )
          if echo "$COMMIT_MSG" | grep -qi '\[skip deploy\]'; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ Deploy skipped — commit message contains [skip deploy]"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "🚀 Deploy will proceed"
          fi

  build:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_REPOSITORY
          script: |
            APP_NAME="${{ vars.APP_NAME }}"
            cd "$HOME/$APP_NAME"
            git pull
            APP_NAME="$APP_NAME" \
              IMAGE_REPO="ghcr.io/$GITHUB_REPOSITORY" \
              bash scripts/deploy.sh ${{ github.sha }}
